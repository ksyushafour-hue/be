<script>
(function() {
  'use strict';

  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.expand(); } catch(e){}
    try { tg.ready(); } catch(e){}
  }

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  const imgBaksik = new Image(); imgBaksik.src = 'baksik.png';
  const imgGrey = new Image(); imgGrey.src = 'grey.png';
  const imgTomato = new Image(); imgTomato.src = 'tomato.png';
  const imgShrimp = new Image(); imgShrimp.src = 'shrimp.png';
  const imgMayo = new Image(); imgMayo.src = 'mayo.png';
  const imgSmetana = new Image(); imgSmetana.src = 'smetana.png';
  const imgKsyusha = new Image(); imgKsyusha.src = 'ksyusha.png';
  const imgVeronika = new Image(); imgVeronika.src = 'veronika.png';

  function resize() {
    let rect = { width: 0, height: 0 };
    try { rect = document.getElementById('game').getBoundingClientRect(); } catch(e){}
    const dpr = window.devicePixelRatio || 1;
    W = rect.width || window.innerWidth || 360;
    H = rect.height || window.innerHeight || 640;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    state.groundY = H * 0.78;
  }
  window.addEventListener('resize', resize);
  if (tg && tg.onEvent) {
    try { tg.onEvent('viewportChanged', resize); } catch(e){}
  }

  const bgMusic = document.getElementById('bg-music');
  const musicBtn = document.getElementById('music-btn');
  let isMusicPlaying = false;
  function startMusic() {
    bgMusic.volume = 0.3;
    bgMusic.play().then(() => { isMusicPlaying = true; musicBtn.textContent = '🔊'; }).catch(()=>{});
  }
  musicBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (isMusicPlaying) { bgMusic.pause(); musicBtn.textContent = '🔇'; isMusicPlaying = false; }
    else { bgMusic.play(); musicBtn.textContent = '🔊'; isMusicPlaying = true; }
  });

  const UPGRADES = [
    { id: 'life',   icon: '❤️', name: 'Запасное сердечко', desc: '+1 к макс. жизням за уровень',           maxLvl: 3, baseCost: 15 },
    { id: 'shrimp', icon: '🦐', name: 'Креветочный магнит', desc: '+20% креветок за уровень',               maxLvl: 5, baseCost: 10 },
    { id: 'jump',   icon: '🦘', name: 'Пружинистые лапы',   desc: '+8% к силе прыжка за уровень',           maxLvl: 4, baseCost: 12 },
    { id: 'slow',   icon: '🐢', name: 'Кошачья грация',     desc: 'Медленнее бег на 5% за уровень',         maxLvl: 4, baseCost: 18 },
    { id: 'hug',    icon: '💕', name: 'Обаяние',            desc: 'Вероника медленнее на 15% за уровень',   maxLvl: 3, baseCost: 20 },
    { id: 'inv',    icon: '🥫', name: 'Майонезный щит',     desc: '+1 сек неуязвимости за уровень',         maxLvl: 3, baseCost: 25 },
    { id: 'start',  icon: '🚀', name: 'Разгон',             desc: 'Старт со 2 уровня скорости',             maxLvl: 1, baseCost: 40 },
  ];

  const progress = { shrimpBank: 0, upgrades: {}, bestScore: 0 };
  UPGRADES.forEach(u => progress.upgrades[u.id] = 0);

  function safeLocalSet(key, val) { try { localStorage.setItem(key, val); } catch(e){} }
  function safeLocalGet(key) { try { return localStorage.getItem(key); } catch(e){ return null; } }

  function saveProgress() {
    const data = JSON.stringify(progress);
    safeLocalSet('catProgress', data);
    if (tg && tg.CloudStorage) { try { tg.CloudStorage.setItem('progress', data); } catch(e){} }
  }

  function loadProgress(cb) {
    let called = false;
    const done = () => { if (!called) { called = true; cb(); } };
    const parse = (val) => {
      if (val) {
        try {
          const p = JSON.parse(val);
          if (p) {
            progress.shrimpBank = p.shrimpBank || 0;
            progress.bestScore = p.bestScore || 0;
            if (p.upgrades) Object.keys(progress.upgrades).forEach(k => {
              if (typeof p.upgrades[k] === 'number') progress.upgrades[k] = p.upgrades[k];
            });
          }
        } catch(e){}
      }
      done();
    };
    setTimeout(done, 1200);
    if (tg && tg.CloudStorage) {
      try {
        tg.CloudStorage.getItem('progress', (err, val) => {
          if (!err && val) parse(val);
          else parse(safeLocalGet('catProgress'));
        });
      } catch(e) { parse(safeLocalGet('catProgress')); }
    } else {
      parse(safeLocalGet('catProgress'));
    }
  }

  function upgradeCost(u) { return Math.round(u.baseCost * Math.pow(1.6, progress.upgrades[u.id])); }
  function canBuy(u) { return progress.upgrades[u.id] < u.maxLvl && progress.shrimpBank >= upgradeCost(u); }
  function buyUpgrade(u) {
    if (!canBuy(u)) return;
    progress.shrimpBank -= upgradeCost(u);
    progress.upgrades[u.id]++;
    saveProgress();
    renderShop();
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
  }

  function renderShop() {
    document.getElementById('shop-balance').textContent = progress.shrimpBank;
    const cont = document.getElementById('shop-items');
    cont.innerHTML = '';
    UPGRADES.forEach(u => {
      const lvl = progress.upgrades[u.id];
      const maxed = lvl >= u.maxLvl;
      const cost = upgradeCost(u);
      const afford = progress.shrimpBank >= cost;
      const div = document.createElement('div');
      div.className = 'shop-item';
      div.innerHTML =
        '<div class="icon">' + u.icon + '</div>' +
        '<div class="info">' +
          '<div class="name">' + u.name + '</div>' +
          '<div class="desc">' + u.desc + '</div>' +
          '<div class="lvl">Уровень: ' + lvl + '/' + u.maxLvl + '</div>' +
        '</div>' +
        '<button ' + (maxed || !afford ? 'disabled' : '') + ' class="' + (maxed ? 'maxed' : '') + '">' +
          (maxed ? 'MAX' : '🦐 ' + cost) +
        '</button>';
      const btn = div.querySelector('button');
      if (!maxed) btn.addEventListener('click', () => buyUpgrade(u));
      cont.appendChild(div);
    });
  }

  function openShop() { renderShop(); document.getElementById('shop').style.display = 'flex'; }
  function closeShop() { document.getElementById('shop').style.display = 'none'; document.getElementById('menu').style.display = 'flex'; }

  function getMaxLives()    { return 3 + progress.upgrades.life; }
  function getJumpMult()    { return 1 + 0.08 * progress.upgrades.jump; }
  function getSlowMult()    { return 1 - 0.05 * progress.upgrades.slow; }
  function getHugMult()     { return 1 - 0.15 * progress.upgrades.hug; }
  function getInvBonus()    { return progress.upgrades.inv; }
  function getShrimpMult()  { return 1 + 0.2 * progress.upgrades.shrimp; }
  function getStartLevel()  { return progress.upgrades.start > 0 ? 1 : 0; }

  const LEVELS = [
    { name: 'Дело — потеха', dist: 0, tint: 'rgba(26, 26, 46, 0)' },
    { name: 'Портки дымятся', dist: 600, tint: 'rgba(255, 120, 0, 0.15)' },
    { name: 'Нос в помидорах', dist: 1500, tint: 'rgba(0, 0, 50, 0.5)' },
    { name: 'Портки на носу', dist: 3000, tint: 'rgba(100, 0, 100, 0.3)' },
    { name: 'Потеха закончилась', dist: 5000, tint: 'rgba(0, 0, 0, 0.6)' }
  ];

  const state = {
    running: false, cat: null, player: null,
    groundObjects: [], flyingTomatoes: [], hearts: [], poops: [],
    score: 0, bestScore: 0, lives: 3, combo: 1, comboTimer: 0,
    mayoCount: 0, invincibleTimer: 0, slipTimer: 0,
    worldSpeed: 320, spawnTimer: 0, spawnInterval: 0.8, flyTimer: 3, heartTimer: 4,
    lastTime: 0, groundY: 300, scrollOffset: 0,
    veronica: null, hugProgress: 0, distance: 0, currentLevel: 0, levelUpTimer: 0,
    shrimpEarned: 0,
  };

  const CAT_CONFIG = {
    baksik: { speedMult: 0.95, jump: 850 },
    grey:   { speedMult: 1.15, jump: 800 }
  };

  function createPlayer(catKey) {
    const cfg = CAT_CONFIG[catKey];
    return { x: W * 0.3, y: 0, vy: 0, width: 46, height: 46, onGround: true, isDucking: false, jumpCount: 0, cfg, anim: 0, stumbleTimer: 0 };
  }

  function spawnObjects() {
    const r = Math.random();
    let type = 'tomato';
    if (r > 0.8) type = 'smetana';
    else if (r > 0.55) type = 'mayo';
    else if (r > 0.25) type = 'shrimp';
    else type = 'tomato';
    const size = type === 'tomato' ? 34 : 30;
    state.groundObjects.push({ type, x: W + 60, y: 0, w: size, h: size, collected: false, bob: Math.random() * 6 });
  }

  function update(dt) {
    const p = state.player;
    if (!p) return;
    if (state.invincibleTimer > 0) state.invincibleTimer -= dt;
    if (state.slipTimer > 0) state.slipTimer -= dt;
    if (state.comboTimer > 0) { state.comboTimer -= dt; } else { state.combo = 1; document.getElementById('combo-text').style.opacity = 0; }

    if (p.isDucking) { p.y = 0; p.vy = 0; p.onGround = true; }
    else { p.vy += 2200 * dt; p.y += p.vy * dt; }
    if (p.y >= 0) { p.y = 0; p.vy = 0; p.onGround = true; p.jumpCount = 0; } else { p.onGround = false; }

    p.anim += dt;
    if (p.stumbleTimer > 0) p.stumbleTimer -= dt;

    const speed = state.worldSpeed * p.cfg.speedMult * getSlowMult() * (state.slipTimer > 0 ? 1.5 : 1);
    state.scrollOffset += speed * dt;
    state.distance += speed * dt;

    if (state.currentLevel < LEVELS.length - 1) {
      if (state.distance >= LEVELS[state.currentLevel + 1].dist) {
        state.currentLevel++;
        state.levelUpTimer = 2.5;
        state.worldSpeed += 60;
        state.spawnInterval = Math.max(0.4, state.spawnInterval - 0.1);
        document.getElementById('level-info').textContent = 'Ур. ' + (state.currentLevel + 1) + ': ' + LEVELS[state.currentLevel].name;
        if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} }
      }
    }
    if (state.levelUpTimer > 0) state.levelUpTimer -= dt;

    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) { spawnObjects(); state.spawnTimer = state.spawnInterval * (0.7 + Math.random() * 0.5); }

    if (state.currentLevel >= 2) {
      state.flyTimer -= dt;
      if (state.flyTimer <= 0) {
        state.flyingTomatoes.push({ x: W - 30, y: state.groundY - 80, w: 34, h: 34, rot: 0 });
        state.flyTimer = 3.5 + Math.random() * 2;
      }
    }

    if (state.hugProgress > 0.8) {
      state.heartTimer -= dt;
      if (state.heartTimer <= 0) {
        state.hearts.push({ x: W * 0.1, y: state.groundY - 50, vx: 400 + Math.random()*200, vy: -200 });
        state.heartTimer = 3.5 + Math.random() * 2;
      }
    }

    if (state.cat === 'grey' && p.onGround && Math.random() < 0.1) {
      state.poops.push({ x: p.x, y: state.groundY - 10, size: 16, rot: Math.random() * 6 });
      state.hugProgress = Math.max(0, state.hugProgress - 0.02);
    }

    for (let i = state.groundObjects.length - 1; i >= 0; i--) {
      const o = state.groundObjects[i];
      o.x -= speed * dt;
      if (o.x + o.w < -50) { state.groundObjects.splice(i, 1); continue; }
      const catH = p.isDucking ? 25 : p.height;
      const py = state.groundY - catH + p.y;
      if (!o.collected && p.x + 6 < o.x + o.w && p.x + p.width - 6 > o.x && py + 6 < state.groundY && py + catH - 6 > state.groundY - o.h) {
        if (state.invincibleTimer > 0 && o.type !== 'smetana' && o.type !== 'shrimp') { o.collected = true; continue; }
        if (o.type === 'tomato') { o.collected = true; takeDamage(); state.combo = 1; }
        else if (o.type === 'shrimp') {
          const gain = Math.max(1, Math.round(1 * getShrimpMult()));
          state.score += gain * state.combo;
          state.shrimpEarned += gain;
          o.collected = true;
        }
        else if (o.type === 'mayo') {
          state.mayoCount++; state.score += 2; o.collected = true;
          if (state.mayoCount >= 3) { state.invincibleTimer = 5 + getInvBonus(); state.mayoCount = 0; if(tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){} } }
        }
        else if (o.type === 'smetana') { state.lives = Math.min(getMaxLives(), state.lives+1); o.collected = true; }
        updateHUD();
      }
    }

    for (let i = state.flyingTomatoes.length - 1; i >= 0; i--) {
      const t = state.flyingTomatoes[i];
      t.x -= (speed + 200) * dt;
      t.rot += dt * 10;
      if (t.x < -50) { state.flyingTomatoes.splice(i, 1); continue; }
      const catTop = state.groundY - (p.isDucking ? 25 : p.height) + p.y;
      const catBottom = state.groundY + p.y;
      if (t.x + t.w > p.x && t.x < p.x + p.width && t.y + t.h > catTop && t.y < catBottom) {
        state.flyingTomatoes.splice(i, 1);
        if (state.invincibleTimer <= 0) takeDamage();
        state.combo = 1;
      }
    }

    for (let i = state.hearts.length - 1; i >= 0; i--) {
      const h = state.hearts[i];
      h.x += h.vx * dt; h.y += h.vy * dt; h.vy += 400 * dt;
      if (h.x > W) { state.hearts.splice(i, 1); continue; }
      if (Math.abs(h.x - p.x) < 40 && Math.abs(h.y - (state.groundY - p.height)) < 50) {
        state.hearts.splice(i, 1);
        state.slipTimer = 2.0;
        if(tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('heavy'); } catch(e){} }
      }
    }

    const hugSpeedBase = 0.15;
    let hugDelta = (p.stumbleTimer > 0 || p.isDucking) ? hugSpeedBase * dt : -0.1 * dt;
    if (hugDelta > 0) hugDelta *= getHugMult();
    state.hugProgress = Math.max(0, Math.min(1, state.hugProgress + hugDelta));
    state.veronica = { x: (W * 0.02) + (p.x - 80 - W * 0.02) * state.hugProgress, y: state.groundY };

    if (state.hugProgress >= 1) endGame('hug');
  }

  function takeDamage() {
    state.lives--;
    state.player.stumbleTimer = 0.5;
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('heavy'); } catch(e){} }
    if (state.lives <= 0) endGame('hp');
  }

  function updateHUD() {
    document.getElementById('lives').textContent = Math.max(0, state.lives);
    document.getElementById('score').textContent = state.score;
    document.getElementById('hug-bar').style.width = (state.hugProgress * 100) + '%';
    const buffsDiv = document.getElementById('buffs');
    buffsDiv.innerHTML = '';
    if (state.invincibleTimer > 0) buffsDiv.innerHTML += '<span class="buff-icon">🥫 Броня</span>';
    if (state.slipTimer > 0) buffsDiv.innerHTML += '<span class="buff-icon" style="color:red">💖 Влюблен</span>';
    if (state.slipTimer > 0) buffsDiv.innerHTML += '<span class="buff-icon">🌊 Скользит</span>';
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = LEVELS[state.currentLevel].tint;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(26, 26, 46, 0.8)'; ctx.fillRect(0, state.groundY, W, H - state.groundY);
    ctx.strokeStyle = '#ffd16644'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, state.groundY); ctx.lineTo(W, state.groundY); ctx.stroke();

    state.groundObjects.forEach(o => {
      if (o.collected) return;
      const y = state.groundY - o.h;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      if (o.type === 'tomato') {
          if(imgTomato.complete) ctx.drawImage(imgTomato, o.x, y, o.w, o.h); else { ctx.font = '30px serif'; ctx.fillText('🍅', o.x+15, y+15); }
      } else if (o.type === 'shrimp') {
          if(imgShrimp.complete) ctx.drawImage(imgShrimp, o.x, y, o.w, o.h); else { ctx.font = '30px serif'; ctx.fillText('🦐', o.x+15, y+15); }
      } else if (o.type === 'mayo') {
          if(imgMayo.complete) ctx.drawImage(imgMayo, o.x, y, o.w, o.h); else { ctx.font = '30px serif'; ctx.fillText('🥫', o.x+15, y+15); }
      } else if (o.type === 'smetana') {
          if(imgSmetana.complete) ctx.drawImage(imgSmetana, o.x, y, o.w, o.h); else { ctx.font = '30px serif'; ctx.fillText('🥛', o.x+15, y+15); }
      }
    });

    state.flyingTomatoes.forEach(t => {
      ctx.save(); ctx.translate(t.x + t.w/2, t.y + t.h/2); ctx.rotate(t.rot);
      if(imgTomato.complete) ctx.drawImage(imgTomato, -t.w/2, -t.h/2, t.w, t.h);
      else { ctx.font = '34px serif'; ctx.fillText('🍅', 0, 0); }
      ctx.restore();
    });

    state.hearts.forEach(h => { ctx.font = '30px serif'; ctx.fillText('💖', h.x, h.y); });
    state.poops.forEach(p => { ctx.font = '20px serif'; ctx.fillText('💩', p.x, p.y); });

    if (state.running) {
      if (state.currentLevel >= 2) {
          if(imgKsyusha.complete) ctx.drawImage(imgKsyusha, W-70, state.groundY-120, 60, 60);
          else { ctx.font = '50px serif'; ctx.fillText('👧', W-40, state.groundY-90); }
      }
      if (state.veronica) {
          ctx.font = '20px serif'; ctx.fillText('💕', state.veronica.x, state.groundY - 80);
          if(imgVeronika.complete) ctx.drawImage(imgVeronika, state.veronica.x-30, state.groundY-70, 60, 60);
          else { ctx.font = '40px serif'; ctx.fillText('👩', state.veronica.x, state.groundY-30); }
      }
      const p = state.player;
      const py = state.groundY - (p.isDucking ? 25 : p.height) + p.y;
      ctx.save();
      if (p.isDucking) ctx.scale(1.3, 0.6);
      else if (!p.onGround) ctx.rotate(0.2);
      else if (p.stumbleTimer > 0) ctx.rotate(Math.sin(p.stumbleTimer * 40) * 0.3);
      if (state.invincibleTimer > 0) ctx.scale(1.3, 1.3);
      ctx.translate(p.x + p.width/2, py + p.height/2);
      const catImg = state.cat === 'baksik' ? imgBaksik : imgGrey;
      if (catImg.complete) ctx.drawImage(catImg, -30, -30, 60, 60);
      else { ctx.font = '40px serif'; ctx.fillText('🐱', 0, 0); }
      if (!p.onGround) { ctx.font = '20px serif'; ctx.fillText('😝', 15, -15); }
      if (p.stumbleTimer > 0) { ctx.font = '20px serif'; ctx.fillText('😵', 15, -15); }
      ctx.restore();
    }

    if (state.levelUpTimer > 0) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(0, H * 0.4 - 40, W, 80);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4cd137'; ctx.font = 'bold 20px sans-serif';
      ctx.fillText('УРОВЕНЬ ' + (state.currentLevel + 1), W / 2, H * 0.4 - 10);
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 24px sans-serif';
      ctx.fillText('«' + LEVELS[state.currentLevel].name + '»', W / 2, H * 0.4 + 20);
    }
  }

  function loop(time) {
    if (!state.lastTime) state.lastTime = time;
    const dt = Math.min(0.05, (time - state.lastTime) / 1000);
    state.lastTime = time;
    if (state.running) update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function jump() {
    const p = state.player;
    if (!p || !state.running || p.isDucking || state.slipTimer > 0) return;
    const maxJumps = state.cat === 'baksik' ? 2 : 1;
    if (p.jumpCount < maxJumps) {
      p.vy = -p.cfg.jump * getJumpMult();
      p.jumpCount++;
      p.onGround = false;
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} }
    }
  }

  document.getElementById('jump-btn').addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
  const duckBtn = document.getElementById('duck-btn');
  duckBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); if(state.player) state.player.isDucking = true; });
  duckBtn.addEventListener('pointerup', (e) => { if(state.player) state.player.isDucking = false; });
  duckBtn.addEventListener('pointerleave', (e) => { if(state.player) state.player.isDucking = false; });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') jump();
    if (e.code === 'ArrowDown') { if(state.player) state.player.isDucking = true; }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') { if(state.player) state.player.isDucking = false; }
  });

  function startGame(catKey) {
    resize();
    state.cat = catKey;
    state.player = createPlayer(catKey);
    state.groundObjects = []; state.flyingTomatoes = []; state.hearts = []; state.poops = [];
    state.score = 0;
    state.lives = getMaxLives();
    state.combo = 1; state.mayoCount = 0;
    state.invincibleTimer = 0; state.slipTimer = 0;
    state.worldSpeed = 320;
    state.spawnTimer = 1; state.spawnInterval = 0.8; state.flyTimer = 3; state.heartTimer = 4;
    state.distance = 0; state.currentLevel = getStartLevel(); state.hugProgress = 0;
    state.shrimpEarned = 0;
    state.running = true; state.lastTime = 0;

    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('jump-btn').style.display = 'flex';
    document.getElementById('duck-btn').style.display = 'flex';
    document.getElementById('music-btn').style.display = 'block';

    document.getElementById('level-info').textContent = 'Ур. ' + (state.currentLevel + 1) + ': ' + LEVELS[state.currentLevel].name;
    updateHUD();
    startMusic();
  }

  function endGame(reason) {
    state.running = false;
    document.getElementById('gameover-title').textContent = reason === 'hug' ? 'Вероника заобнимала! 💕' : 'Кот устал от помидоров!';
    document.getElementById('final-score').textContent = state.score;
    document.getElementById('earned-shrimp').textContent = state.shrimpEarned;
    progress.shrimpBank += state.shrimpEarned;
    if (state.score > progress.bestScore) progress.bestScore = state.score;
    document.getElementById('best-score').textContent = progress.bestScore;
    saveProgress();

    const shopBtn = document.getElementById('shop-btn');
    if (shopBtn) shopBtn.textContent = '🛒 Магазин (🦐 ' + progress.shrimpBank + ')';

    document.getElementById('gameover').style.display = 'flex';
    document.getElementById('jump-btn').style.display = 'none';
    document.getElementById('duck-btn').style.display = 'none';
    document.getElementById('music-btn').style.display = 'none';
    if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('error'); } catch(e){} }
  }

  document.getElementById('share-btn').addEventListener('click', () => {
      const text = 'Я пробежал по Твери и набрал ' + state.score + ' очков! А ты сможешь?';
      if (tg) { try { tg.switchInlineQuery(text, ['users', 'groups']); } catch(e) { alert(text); } }
      else alert('Поделиться можно только в Telegram!');
  });

  document.getElementById('shop-btn').addEventListener('click', openShop);
  document.getElementById('shop-open-btn').addEventListener('click', openShop);
  document.getElementById('shop-close').addEventListener('click', closeShop);

  let selectedCat = null;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedCat = btn.dataset.cat;
      document.getElementById('start-btn').style.display = 'block';
    });
  });
  document.getElementById('start-btn').addEventListener('click', () => { if (selectedCat) startGame(selectedCat); });
  document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('gameover').style.display = 'none';
    document.getElementById('menu').style.display = 'flex';
    selectedCat = null;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('start-btn').style.display = 'none';
    saveProgress();
  });

  function init() {
    resize();
    requestAnimationFrame(() => {
      resize();
      loadProgress(() => {
        document.getElementById('best-score').textContent = progress.bestScore;
        const shopBtn = document.getElementById('shop-btn');
        if (shopBtn) shopBtn.textContent = '🛒 Магазин (🦐 ' + progress.shrimpBank + ')';
        renderShop();
        requestAnimationFrame(loop);
      });
    });
  }
  init();
})();
</script>
