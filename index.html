<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Баксик и Серый: Тверь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; overflow: hidden; background: #1a1a2e; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #game { position: relative; width: 100vw; height: 100vh; max-width: 500px; max-height: 900px; overflow: hidden; background: #2a2a4a; }
  canvas { display: block; width: 100%; height: 100%; }

  #menu {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 20px;
    background: rgba(26,26,46,0.85); /* Полупрозрачное меню, чтобы фон было видно */
    text-align: center;
  }
  #menu h1 { font-size: 22px; line-height: 1.3; }
  #menu p { font-size: 14px; opacity: 0.85; max-width: 330px; line-height: 1.4; }
  .cats { display: flex; gap: 16px; }
  .cat-btn {
    width: 120px; padding: 14px 10px; border-radius: 16px; border: 3px solid transparent;
    background: #3a3a5a; color: #fff; font-size: 16px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: transform 0.1s, border-color 0.2s;
  }
  .cat-btn:active { transform: scale(0.95); }
  .cat-btn.selected { border-color: #ffd166; background: #4a4a6a; }
  .cat-img { width: 60px; height: 60px; object-fit: contain; }
  .cat-desc { font-size: 11px; opacity: 0.75; }
  #start-btn {
    padding: 16px 40px; font-size: 20px; border-radius: 999px; border: none;
    background: #ffd166; color: #1a1a2e; font-weight: bold; cursor: pointer;
    display: none;
  }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: none; flex-direction: column; gap: 8px; padding: 12px 16px;
    font-size: 16px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  #hud .row { display: flex; justify-content: space-between; }
  #hud .score { color: #ffd166; }

  #hug-bar-wrap {
    width: 100%; height: 14px; border-radius: 999px;
    background: rgba(255,255,255,0.15); overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
  }
  #hug-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff6b6b, #ff9f43);
    transition: width 0.15s linear;
  }
  #hug-label { font-size: 11px; opacity: 0.85; margin-top: 2px; }

  #jump-btn {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    z-index: 5; width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255, 209, 102, 0.2); border: 4px solid #ffd166;
    color: #ffd166; font-size: 24px; font-weight: bold; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); backdrop-filter: blur(4px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    touch-action: none;
  }
  #jump-btn:active { background: rgba(255, 209, 102, 0.5); transform: translateX(-50%) scale(0.95); }

  #gameover {
    position: absolute; inset: 0; z-index: 10; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(26,26,46,0.92); text-align: center; padding: 20px;
  }
  #gameover h2 { font-size: 26px; color: #ff6b6b; }
  #gameover .final { font-size: 20px; }
  #gameover button {
    padding: 14px 32px; font-size: 18px; border-radius: 999px; border: none;
    background: #ffd166; color: #1a1a2e; font-weight: bold; cursor: pointer;
  }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="row">
      <div>❤️ <span id="lives">3</span></div>
      <div class="score">🦐 <span id="score">0</span></div>
    </div>
    <div>
      <div id="hug-bar-wrap"><div id="hug-bar"></div></div>
      <div id="hug-label">Обнимашки Вероники</div>
    </div>
  </div>

  <div id="menu">
    <h1>Баксик и Серый</h1>
    <p>Вероника хочет заобнимать котов! Они убегают по Твери. Собирай креветки и майонез, не наступай на помидоры!</p>
    <div class="cats">
      <button class="cat-btn" data-cat="baksik">
        <img src="baksik.png" class="cat-img" alt="Баксик">
        <span>Баксик</span>
        <span class="cat-desc">ловкий</span>
      </button>
      <button class="cat-btn" data-cat="grey">
        <img src="grey.png" class="cat-img" alt="Серый">
        <span>Серый</span>
        <span class="cat-desc">какает на бегу</span>
      </button>
    </div>
    <button id="start-btn">Играть</button>
  </div>

  <button id="jump-btn">ПРЫЖОК</button>

  <div id="gameover">
    <h2 id="gameover-title">Вероника догнала!</h2>
    <div class="final">Счёт: <span id="final-score">0</span></div>
    <button id="restart-btn">Ещё раз</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.ready(); }

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;

// Загрузка картинок
const imgBaksik = new Image();
imgBaksik.src = 'baksik.png';
const imgGrey = new Image();
imgGrey.src = 'grey.png';
const imgBg = new Image();
imgBg.src = 'bg.png';

function resize() {
  const rect = document.getElementById('game').getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = rect.width; H = rect.height;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

const state = {
  running: false,
  cat: null,
  player: null,
  objects: [],
  poops: [],
  score: 0,
  lives: 3,
  worldSpeed: 320,
  spawnTimer: 0,
  spawnInterval: 0.75,
  poopTimer: 0,
  lastTime: 0,
  groundY: 0,
  scrollOffset: 0,
  veronica: null,
  hugProgress: 0,
  hugRate: 0.06,
  hugRecover: 0.12,
};

const CAT_CONFIG = {
  baksik: { name: 'Баксик', emoji: '🐱', speedMult: 0.95, jump: 850, hugRate: 0.055 },
  grey:   { name: 'Серый',  emoji: '🐈‍⬛', speedMult: 1.15, jump: 850, hugRate: 0.065 },
};

function createPlayer(catKey) {
  const cfg = CAT_CONFIG[catKey];
  return {
    x: W * 0.35,
    y: 0,          
    vy: 0,
    width: 46,
    height: 46,
    onGround: true,
    cfg,
    anim: 0,
    stumbleTimer: 0,
  };
}

function spawnObject() {
  const r = Math.random();
  const type = r < 0.55 ? 'tomato' : (r < 0.8 ? 'shrimp' : 'mayo');
  const size = type === 'tomato' ? 34 : 30;
  const count = type === 'tomato' && Math.random() < 0.35 ? 2 + Math.floor(Math.random() * 2) : 1;

  for (let i = 0; i < count; i++) {
    state.objects.push({
      type,
      x: W + 60 + i * (size + 30 + Math.random() * 20),
      y: 0,
      w: size,
      h: size,
      collected: false,
      bob: Math.random() * Math.PI * 2,
    });
  }
}

function update(dt) {
  const p = state.player;
  if (!p) return;

  p.vy += 2200 * dt; 
  p.y += p.vy * dt;  

  if (p.y >= 0) { 
    p.y = 0; 
    p.vy = 0; 
    p.onGround = true; 
  } else {
    p.onGround = false;
  }

  p.anim += dt;
  if (p.stumbleTimer > 0) p.stumbleTimer -= dt;

  const speed = state.worldSpeed * p.cfg.speedMult;
  state.scrollOffset += speed * dt;

  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnObject();
    state.spawnTimer = state.spawnInterval * (0.65 + Math.random() * 0.7);
    state.worldSpeed = Math.min(560, state.worldSpeed + 4 * dt);
  }

  if (state.cat === 'grey') {
    state.poopTimer -= dt;
    if (state.poopTimer <= 0) {
      state.poops.push({
        x: p.x,
        y: state.groundY - 10,
        size: 16,
        rot: Math.random() * Math.PI * 2
      });
      state.poopTimer = 0.4 + Math.random() * 0.3;
    }
  }

  for (let i = state.objects.length - 1; i >= 0; i--) {
    const o = state.objects[i];
    o.x -= speed * dt;
    if (o.x + o.w < -20) { state.objects.splice(i, 1); continue; }

    if (!o.collected && hitTest(p, o)) {
      if (o.type === 'tomato') {
        o.collected = true;
        state.lives--;
        p.stumbleTimer = 0.6;
        state.hugProgress = Math.min(1, state.hugProgress + 0.18);
        updateHUD();
        if (tg) tg.HapticFeedback.impactOccurred('heavy');
        if (state.lives <= 0) { endGame('hp'); return; }
      } else {
        o.collected = true;
        state.score += o.type === 'shrimp' ? 1 : 2;
        updateHUD();
        if (tg) tg.HapticFeedback.impactOccurred(o.type === 'mayo' ? 'medium' : 'light');
      }
    }
  }

  for (let i = state.poops.length - 1; i >= 0; i--) {
    const poop = state.poops[i];
    poop.x -= speed * dt;
    if (poop.x < -30) state.poops.splice(i, 1);
  }

  let hugDelta = p.stumbleTimer > 0 ? state.hugRate * 2.2 * dt : -state.hugRecover * dt;
  state.hugProgress = Math.max(0, Math.min(1, state.hugProgress + hugDelta));

  const vStart = W * 0.02;
  const vEnd = p.x - 60;
  state.veronica = {
    x: vStart + (vEnd - vStart) * state.hugProgress,
    y: state.groundY,
    bob: Math.sin(performance.now() / 200) * 3,
  };

  if (state.hugProgress >= 1) endGame('hug');
}

function hitTest(p, o) {
  const px = p.x;
  const py = state.groundY - p.height + p.y; 
  const pw = p.width;
  const ph = p.height;
  
  const ox = o.x;
  const oy = state.groundY - o.h;
  const ow = o.w;
  const oh = o.h;
  const pad = 6;
  
  return (
    px + pad < ox + ow && px + pw - pad > ox &&
    py + pad < oy + oh && py + ph - pad > oy
  );
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // --- РИСУЕМ ФОН ---
  if (imgBg.complete && imgBg.naturalHeight !== 0) {
    const imgRatio = imgBg.width / imgBg.height;
    const screenRatio = W / H;
    let drawWidth = W;
    let drawHeight = H;
    let offsetX = 0;
    let offsetY = 0;

    if (imgRatio > screenRatio) {
      drawWidth = H * imgRatio;
      offsetX = (W - drawWidth) / 2;
    } else {
      drawHeight = W / imgRatio;
      offsetY = (H - drawHeight) / 2;
    }
    ctx.drawImage(imgBg, offsetX, offsetY, drawWidth, drawHeight);
  } else {
    // Если фона нет, рисуем темный
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, W, H);
  }

  // Земля (дорога)
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, state.groundY, W, H - state.groundY);
  ctx.strokeStyle = '#ffd16644';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, state.groundY);
  ctx.lineTo(W, state.groundY);
  ctx.stroke();

  // Разметка на дороге
  ctx.strokeStyle = '#ffffff15';
  ctx.lineWidth = 3;
  const dashOffset = (state.scrollOffset * 0.6) % 60;
  for (let x = -dashOffset; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, state.groundY + 14);
    ctx.lineTo(x + 30, state.groundY + 14);
    ctx.stroke();
  }

  // Какашки Серого
  state.poops.forEach(poop => {
    ctx.save();
    ctx.translate(poop.x, poop.y);
    ctx.rotate(poop.rot);
    ctx.font = `${poop.size}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💩', 0, 0);
    ctx.restore();
  });

  // Помидоры, Креветки, Майонез
  state.objects.forEach(o => {
    if (o.collected) return;
    const y = state.groundY - o.h;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if (o.type === 'tomato') {
      ctx.font = `${o.w}px serif`;
      ctx.fillText('🍅', o.x + o.w / 2, y + o.h / 2);
    } else if (o.type === 'shrimp') {
      const bob = Math.sin(o.bob + performance.now() / 300) * 3;
      ctx.font = `${o.w}px serif`;
      ctx.fillText('🦐', o.x + o.w / 2, y + o.h / 2 + bob);
    } else {
      const bob = Math.sin(o.bob + performance.now() / 400) * 3;
      ctx.font = `${o.w}px serif`;
      ctx.fillText('🥫', o.x + o.w / 2, y + o.h / 2 + bob);
    }
  });

  // Вероника
  if (state.veronica && state.running) {
    const v = state.veronica;
    const heartBob = Math.sin(performance.now() / 250) * 4;
    ctx.font = '20px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('💕', v.x, state.groundY - 90 + heartBob);
    ctx.font = '44px serif';
    ctx.fillText('👩', v.x, state.groundY - 30 + v.bob);
    ctx.font = '10px sans-serif';
    ctx.fillStyle = '#ff9f43cc';
    ctx.fillText('Вероника', v.x, state.groundY - 70);
    ctx.fillStyle = '#fff';
  }

  if (!state.running) return;

  // Кот
  const p = state.player;
  if (p) {
    const px = p.x;
    const py = state.groundY - p.height + p.y; 

    const shadowScale = 1 - Math.min(0.6, Math.abs(p.y) / 300);
    ctx.fillStyle = `rgba(0,0,0,${0.35 * shadowScale})`;
    ctx.beginPath();
    ctx.ellipse(px + p.width / 2, state.groundY - 4, p.width * 0.5 * shadowScale, 6 * shadowScale, 0, 0, Math.PI * 2);
    ctx.fill();

    let bobY = 0;
    let rot = 0;
    if (p.onGround) {
      bobY = Math.abs(Math.sin(p.anim * 15)) * 4;
    } else {
      rot = 0.2; 
    }

    if (p.stumbleTimer > 0) {
      rot = Math.sin(p.stumbleTimer * 40) * 0.25;
      bobY += 4;
    }

    ctx.save();
    ctx.translate(px + p.width / 2, py + p.height / 2 - bobY);
    ctx.rotate(rot);
    
    const catImage = state.cat === 'baksik' ? imgBaksik : imgGrey;
    if (catImage.complete && catImage.naturalHeight !== 0) {
        ctx.drawImage(catImage, -30, -30, 60, 60);
    } else {
        ctx.font = '40px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.cfg.emoji, 0, 0);
    }
    
    ctx.restore();
  }
}

function updateHUD() {
  document.getElementById('lives').textContent = Math.max(0, state.lives);
  document.getElementById('score').textContent = state.score;
  document.getElementById('hug-bar').style.width = (state.hugProgress * 100) + '%';
}

function loop(time) {
  if (!state.lastTime) state.lastTime = time;
  const dt = Math.min(0.05, (time - state.lastTime) / 1000);
  state.lastTime = time;

  if (state.running) update(dt);
  render();
  if (state.running) {
    document.getElementById('hug-bar').style.width = (state.hugProgress * 100) + '%';
  }

  requestAnimationFrame(loop);
}

function jump() {
  const p = state.player;
  if (!p || !state.running) return; 
  
  if (p.onGround) {
    p.vy = -p.cfg.jump; 
    p.onGround = false;
    p.y = -1; 
    if (tg) tg.HapticFeedback.impactOccurred('light');
  }
}

const jumpBtn = document.getElementById('jump-btn');
jumpBtn.addEventListener('pointerdown', (e) => { 
    e.preventDefault(); 
    e.stopPropagation(); 
    jump(); 
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});

function startGame(catKey) {
  state.cat = catKey;
  state.player = createPlayer(catKey);
  state.objects = [];
  state.poops = [];
  state.score = 0;
  state.lives = 3;
  state.worldSpeed = 320;
  state.spawnTimer = 0.8;
  state.spawnInterval = 0.75;
  state.poopTimer = 1; 
  state.scrollOffset = 0;
  state.hugProgress = 0;
  state.hugRate = CAT_CONFIG[catKey].hugRate;
  state.hugRecover = 0.12;
  state.veronica = null;
  state.running = true;
  state.lastTime = 0;

  document.getElementById('menu').style.display = 'none';
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  jumpBtn.style.display = 'flex';
  updateHUD();
  if (tg) tg.HapticFeedback.impactOccurred('medium');
}

function endGame(reason) {
  state.running = false;
  const title = document.getElementById('gameover-title');
  if (reason === 'hug') {
    title.textContent = 'Вероника заобнимала! 💕';
  } else {
    title.textContent = 'Кот устал от помидоров!';
  }
  document.getElementById('final-score').textContent = state.score;
  document.getElementById('gameover').style.display = 'flex';
  jumpBtn.style.display = 'none';
  if (tg) tg.HapticFeedback.notificationOccurred('error');
}

let selectedCat = null;
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCat = btn.dataset.cat;
    document.getElementById('start-btn').style.display = 'block';
    if (tg) tg.HapticFeedback.selectionChanged();
  });
});

document.getElementById('start-btn').addEventListener('click', () => {
  if (selectedCat) startGame(selectedCat);
});

document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
  selectedCat = null;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('start-btn').style.display = 'none';
});

function init() {
  resize();
  state.groundY = H * 0.78;
  requestAnimationFrame(loop);
}
init();
window.addEventListener('resize', () => {
  resize();
  state.groundY = H * 0.78;
});
</script>
</body>
</html>
